<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whole Leadership Reflection Cards</title><style>:root{--t:#035c5f;--a:#189a9e;--g:#f1c74d;--c:#fffaf4;--p:#bedbe0;--i:#244849}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Montserrat,Arial,sans-serif}button{font:inherit}.wrap{max-width:1100px;margin:auto;padding:28px 18px 55px}.hero{text-align:center;padding:25px 8px}.k{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--a)}h1{color:var(--t);font-size:clamp(30px,5vw,50px);line-height:1.05;margin:9px 0}h2{color:var(--t)}.hero p{max-width:650px;margin:10px auto;color:#557070}.btn{border:0;border-radius:99px;padding:11px 17px;background:var(--t);color:#fff;font-weight:700;cursor:pointer}.gold{background:var(--g);color:var(--t)}.pale{background:var(--p);color:var(--t)}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.panel{background:#fff;border:1px solid #dce9e9;border-radius:22px;padding:25px;box-shadow:0 14px 38px #035c5f12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.set{background:#fff;border:1px solid #dce9e9;border-radius:17px;padding:20px;text-align:left;cursor:pointer;min-height:155px}.set:hover{transform:translateY(-2px);box-shadow:0 12px 25px #035c5f16}.set b{color:var(--a);font-size:11px;letter-spacing:.14em}.set h3{color:var(--t);margin:8px 0;font-size:19px}.set p{font-size:13px;color:#587070}.screen{display:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.focus{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-top:20px}.focus p,.focus li{font-size:14px;color:#506969}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.tile{background:#fff;border:1px solid #dce9e9;border-radius:17px;padding:19px;text-align:left;cursor:pointer;min-height:175px}.tile .num{color:var(--a);font-size:11px;font-weight:700}.tile h3{color:var(--t);font-size:19px;line-height:1.15;margin:13px 0 7px}.tile em{color:#587070;font-size:13px}.modal{position:fixed;inset:0;background:#035c5fba;display:none;align-items:center;justify-content:center;padding:15px;z-index:9999}.modal > #modalin{display:block;background:var(--c);border-radius:23px;width:min(610px,96vw);max-height:92vh;overflow:auto;padding:29px;box-shadow:0 25px 70px #0006;color:var(--i)}.card{background:var(--c);border-radius:23px;width:min(610px,96vw);max-height:92vh;overflow:auto;padding:29px;box-shadow:0 25px 70px #0006}.card.back{background:#fff}.card .k{display:block}.card h2{font-size:33px;line-height:1.08;margin:9px 0}.ess{font-size:16px;color:#587070;font-style:italic}.ref{border-left:4px solid var(--g);padding:10px 0 10px 17px;margin:24px 0}.ref b{font-size:11px;letter-spacing:.14em;color:var(--t)}.ref p{font-size:19px;margin:5px 0}.step{padding:10px 0;border-bottom:1px solid #e2ecec}.step:last-child{border:0}.step b{font-size:11px;letter-spacing:.13em;color:var(--t)}.step p{margin:4px 0;font-size:14px}.modalbar{display:flex;justify-content:space-between;gap:8px;margin-top:15px}.ints{display:grid;grid-template-columns:1fr 1fr;gap:17px}.int{background:#fff;border:1px solid #dce9e9;border-radius:18px;padding:22px}.int h3{color:var(--t)}.int .q{font-size:18px;font-style:italic;color:#587070}.note{text-align:center;color:#718181;font-size:12px;margin-top:25px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.focus{grid-template-columns:1fr}}@media(max-width:550px){.grid,.cards,.ints{grid-template-columns:1fr}.top{display:block}.card{padding:23px}}.tile.orientation{background:#f6f0dd;border-color:rgba(241,199,77,.55)}.tile.orientation h3{color:var(--t)}.modal > #modalin .card{width:auto;max-height:none;overflow:visible;padding:0;background:transparent;box-shadow:none}
</style></head>
<body><div class="wrap">
<section id="home" style="display: block;">
  <div class="hero">
    <h1>What would you like to explore?</h1>
    <p>Choose an expression of Whole Leadership, or draw a card and see what emerges.</p>
    <div class="actions">
      <button class="btn gold" id="drawBtn" type="button">Draw a Card</button>
      <button class="btn pale" id="integrationBtn" type="button">Explore Integration</button>
    </div>
  </div>
  <div class="panel">
    <h2>Explore an Expression</h2>
    <div class="grid" id="sets"><button type="button" class="set" data-action="expression" data-key="Holding|The Grounded Leader"><b>Holding</b><h3>The Grounded Leader</h3><p>Explore seven reflections for this leadership expression.</p></button><button type="button" class="set" data-action="expression" data-key="Receiving|The Wise Mentor"><b>Receiving</b><h3>The Wise Mentor</h3><p>Explore seven reflections for this leadership expression.</p></button><button type="button" class="set" data-action="expression" data-key="Directing|The Visionary Pioneer"><b>Directing</b><h3>The Visionary Pioneer</h3><p>Explore seven reflections for this leadership expression.</p></button><button type="button" class="set" data-action="expression" data-key="Moving|The Purposeful Builder"><b>Moving</b><h3>The Purposeful Builder</h3><p>Explore seven reflections for this leadership expression.</p></button></div>
  </div>
  <div class="note">© 2026 The Pacesetters™ Leadership Center</div>
</section>

<section id="deck" class="screen" style="display: none;">
  <button class="btn pale" id="backBtn" type="button">← Back</button>
  <div class="panel" style="margin-top:15px">
    <div class="top">
      <div><div class="k" id="lab"></div><h2 id="title"></h2></div>
      <button class="btn gold" id="drawCurrentBtn" type="button">Draw a Card</button>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</section>

<section id="ints" class="screen" style="display: none;">
  <button class="btn pale" id="integrationBackBtn" type="button">← Back</button>
  <div class="panel" style="margin-top:15px">
    <div class="hero">
      <div class="k">INTEGRATION</div>
      <h1 style="font-size:35px">Inner &amp; Outer Leadership Work</h1>
    </div>
    <div class="ints" id="intgrid"></div>
  </div>
</section>
</div>

<div class="modal" id="modal" style="display: none;">
  <div id="modalin" role="dialog" aria-modal="true"></div>
</div>
<script>
const D={"Holding|The Grounded Leader": [["Wholehearted Living", "Shows up fully aligned with heart, mind and action.", "Where am I being invited to bring more of myself into how I lead?", ["Where are my intentions, words and actions aligned — and where are they not?", "What would it look like to lead this situation more wholeheartedly?", "Choose one decision, conversation or commitment where you will bring greater congruence between what you believe, say and do.", "What becomes possible for others when my leadership is more congruent?"]], ["Vision for the Future", "Sees what could be, even when current reality says otherwise.", "What possibility for the future is worth keeping visible, even if I cannot yet see the path clearly?", ["What is the current reality telling me — and what might it be preventing me from seeing?", "What possibility remains worth holding onto?", "Describe the future you want to move towards in one clear sentence.", "How might holding this possibility influence the choices of others?"]], ["Steadfast Perseverance", "Stays consistent and grounded through seasons of waiting.", "What deserves my continued commitment, even though the results are taking longer than expected?", ["Where might impatience be influencing my decisions?", "What is within my control while I wait?", "Identify one small action you can continue consistently.", "What does my consistency make possible for those who depend on me?"]], ["Courage to Claim New Ground", "Takes ownership of growth, even when stretched.", "Where am I being invited to take greater ownership of my growth?", ["Where have I outgrown my current way of thinking, leading or working?", "What is stretching me — and what might that stretch be developing?", "Take one action that moves you beyond your current comfort zone.", "How might my growth expand what I can contribute to others?"]], ["Legacy & Multiplying Impact", "Builds what outlasts them and empowers others.", "What am I building today that should continue to create value beyond my direct involvement?", ["Where am I creating dependence rather than capability?", "What could continue without me?", "Transfer one piece of knowledge, responsibility or opportunity to someone else.", "How could my leadership create capability that continues beyond me?"]], ["A Distinctive Edge", "Develops an uncommon resilience and clarity in how they lead.", "What is distinctive about the way I lead, and where could I use that strength more deliberately?", ["What qualities consistently help me navigate complexity well?", "What strength have I developed through experience that I may be underusing?", "Bring one of your distinctive strengths deliberately into a current leadership challenge.", "How could my distinctive contribution strengthen the people or system around me?"]], ["Integration", "Brings courage, clarity and consistency into daily practice.", "What would it look like to bring what I have recognised into the way I lead every day?", ["What have these reflections revealed about how I lead?", "Which insight matters most for this season?", "Choose one behaviour, rhythm or decision that will make this insight visible.", "What difference could this integrated way of leading make over time?"]]], "Receiving|The Wise Mentor": [["Guidance", "Empowers others rather than controlling outcomes.", "Where might I create more space for someone else to think, decide or lead?", ["Where am I supporting someone’s thinking — and where might I be taking over?", "What does this person need from me: an answer, a question, perspective or space?", "In your next conversation, ask before advising.", "What capability could grow if I created more room for someone else to lead?"]], ["Seeing Potential", "Recognises and nurtures emerging potential.", "Whose potential might I be seeing — or missing — right now?", ["What strengths, possibilities or qualities do I see emerging in this person?", "What might become possible if those strengths were given greater space?", "Name one specific strength or possibility you see in someone and tell them.", "How might recognising potential strengthen the wider team or system?"]], ["Sound Counsel", "Speaks with clarity, timing and care.", "When is my perspective most useful, and when is it better to listen?", ["Am I speaking because my perspective is needed — or because I feel I should have the answer?", "What does this moment require: listening, questioning, perspective or challenge?", "Before offering advice, ask one more question.", "How can the way I offer perspective strengthen another person’s judgement rather than replace it?"]], ["Sustainability", "Creates systems and practices that continue beyond their presence.", "What needs to be in place so that good work can continue without me?", ["Where does the success of this work still depend too heavily on me?", "What knowledge, relationship, process or responsibility needs to be shared?", "Identify one thing you can document, delegate or develop in someone else.", "What becomes more sustainable when leadership is distributed?"]], ["Timely Release", "Creates space for others to lead and grow.", "What am I holding onto that someone else may now be ready to carry?", ["Where might my involvement be limiting someone else’s growth?", "What would happen if I stepped back without stepping away?", "Hand over one responsibility with the support and clarity needed for success.", "What leadership capacity could emerge when I create space rather than occupy it?"]], ["Learning from Experience", "Turns experience into insight that others can use.", "What have I learned through experience that could be useful to someone else?", ["Which experiences have genuinely changed how I think, decide or lead?", "What is the lesson beneath the experience?", "Share one lesson without prescribing that someone else follow your path.", "How can experience become shared wisdom rather than remain personal knowledge?"]], ["Healthy Succession", "Prepares others to carry responsibility and purpose forward.", "Who needs to be ready to lead what I currently carry?", ["Where am I developing capability — and where am I simply maintaining dependence?", "What experience, responsibility or opportunity would help someone become more ready?", "Give someone meaningful responsibility with appropriate support and room to learn.", "What becomes possible when leadership can continue beyond any one person?"]]], "Directing|The Visionary Pioneer": [["Stepping into the Unknown", "Moves with confidence even when the full path isn't visible.", "What step can I take even though I cannot yet see the whole path?", ["What do I know, what do I not yet know, and what can only be learned by moving?", "What is the next meaningful step rather than the whole journey?", "Take one considered action that will create new information or possibility.", "What might become possible for others if I am willing to move first?"]], ["Marking Milestones", "Recognises and celebrates meaningful progress.", "What progress deserves to be noticed before I move on to what comes next?", ["What has changed, grown or moved forward?", "What might I overlook if I focus only on the destination?", "Pause to name one meaningful milestone and acknowledge the people who contributed to it.", "How might recognising progress strengthen confidence and momentum for others?"]], ["Vision with Patience", "Holds long-term goals while staying present to today’s work.", "What future am I holding, and what does it require of me today?", ["Where might my focus on the future be pulling me away from what needs attention now?", "What can be done today that serves the longer-term direction?", "Identify one immediate action that contributes to the future you are building towards.", "How can I hold the longer view without asking others to live only in the future?"]], ["Expanding Possibility", "Challenges assumptions to unlock new opportunities.", "What assumption might I need to question to see what else is possible?", ["What am I treating as fixed that may actually be open to change?", "Whose perspective might reveal a possibility I have not considered?", "Take one assumption and deliberately test it.", "What new opportunity could emerge if we challenged the way things have always been done?"]], ["Partnership & Collaboration", "Builds shared purpose through authentic alliances.", "Who needs to be part of this possibility for it to become real?", ["Where am I trying to carry the possibility alone?", "What perspectives, capabilities or relationships are missing?", "Invite one person or group into the possibility before the plan is fully formed.", "What could become possible through shared ownership rather than individual effort?"]], ["Leading with Optimism", "Stays steady and hopeful when outcomes are still forming.", "What would it mean to remain hopeful without losing sight of reality?", ["What is uncertain, unfinished or difficult right now?", "What remains possible despite that reality?", "Name what is difficult honestly, then identify one possibility worth continuing to pursue.", "How might the way I hold uncertainty affect the confidence and energy of others?"]], ["Generational Stewardship", "Builds for sustainability and long-term relevance.", "What am I creating now that should remain meaningful long after this moment has passed?", ["What are the longer-term consequences of the direction I am setting?", "What would make this vision relevant beyond the present moment?", "Make one decision with the needs of those who come after you in mind.", "What might this generation inherit because of what I choose to build now?"]]], "Moving|The Purposeful Builder": [["Choose to Rebuild", "Takes ownership for renewal where there’s breakdown.", "What needs to be rebuilt, renewed or restored — and what part is mine to take responsibility for?", ["What is no longer working as it needs to?", "What needs to change, and what is still worth preserving?", "Identify one part of the situation where you can begin rebuilding.", "What could become stronger if I take responsibility for renewal?"]], ["Plan then Act", "Aligns vision with structure and foresight.", "What needs to be clear or in place before I move into action?", ["Where am I tempted to act before the foundations are ready?", "What people, resources, decisions or structures are needed?", "Define the next stage clearly before adding more activity.", "How might better preparation make it easier for others to contribute effectively?"]], ["Lead in Opposition", "Stays grounded when facing resistance.", "What is resistance telling me, and what does it require of me?", ["Where is resistance showing up — in people, process, resources or assumptions?", "What might the resistance be revealing?", "Distinguish between resistance that needs to be understood and resistance that needs to be navigated.", "What could become stronger if I engage resistance rather than simply push against it?"]], ["Focus on Purpose", "Protects what matters most.", "What matters most here, and what could distract me from it?", ["What is currently consuming attention without contributing meaningfully to the purpose?", "What needs to be protected, prioritised or stopped?", "Make one choice that brings time, resources or attention back to what matters most.", "What becomes clearer for others when I consistently protect the purpose?"]], ["Mobilise Others", "Inspires ownership and collaboration.", "What would help others move from being involved to taking ownership?", ["Where am I carrying responsibility that could be shared?", "What do people need in order to take meaningful ownership?", "Give someone clear responsibility, authority and room to contribute.", "How could shared ownership strengthen the work beyond my own effort?"]], ["Compassion & Integrity", "Balances clarity and accountability with care.", "How can I hold what matters firmly while remaining attentive to the people affected by my decisions?", ["Where might I be leaning too heavily towards results or relationships?", "What would both integrity and compassion require here?", "Have the necessary conversation or make the necessary decision with clarity and care.", "What kind of culture is created when people experience both accountability and care?"]], ["Celebrate Completion", "Honours achievement and renewal.", "What deserves to be completed, acknowledged or celebrated before I move on?", ["What has actually been completed, changed or achieved?", "What have we learned through the process?", "Pause to acknowledge the achievement and the people who contributed to it.", "How might recognising completion create energy and readiness for what comes next?"]]]},I={"Inner Leadership Work": ["Leadership begins within; clarity, rhythm, and self-awareness.", "What is happening within me?", [["REVEAL", "What am I noticing about my current state, patterns or responses?"], ["INTEGRATE", "What needs to come into greater alignment within me?"], ["EMBODY", "What will this look like in my choices, rhythms or behaviour?"], ["MULTIPLY", "How might this inner shift change the way I lead and shape my impact?"]]], "Outer Leadership Work": ["Leadership is expressed through action, contribution, and collaboration.", "What am I creating around me?", [["REVEAL", "What am I noticing in the people, relationships or system around me?"], ["INTEGRATE", "What needs to be understood, aligned or addressed?"], ["EMBODY", "What action will I take or enable?"], ["MULTIPLY", "What could become possible for others or the wider system?"]]]};F={
'Holding|The Grounded Leader':{
 focus:'This set is about showing up fully, bringing intention, action, and perspective together. It supports leaders in remaining grounded, resilient, and forward-looking, even during times of uncertainty or change.',
 best:['Strengthen your personal alignment between values, choices, and actions.','Maintain consistency and composure during challenging or transitional periods.','Reflect on growth, courage, and the long-term impact of your leadership.']},
'Receiving|The Wise Mentor':{
 focus:'For leaders shaping teams, culture, and growth. This set nurtures thoughtful guidance, the development of others, and sustainable leadership rooted in trust, humility, and insight.',
 best:['Use these cards when mentoring, coaching, or building leadership capacity within your team.','They help refine how you share wisdom, recognise potential, empower others, and create systems and succession that endure beyond your direct influence.']},
'Directing|The Visionary Pioneer':{
 focus:'Ideal for innovators, entrepreneurs, and leaders navigating the edge of change. This set cultivates courage, vision, and foresight while keeping action intentional and grounded.',
 best:['Use these cards when exploring new opportunities, stepping into the unknown, or shaping what’s next.','They support dreaming boldly, recognising progress, fostering collaboration, and creating lasting impact.']},
'Moving|The Purposeful Builder':{
 focus:'For culture shapers, managers, and founders driving transformation. This set cultivates purposeful leadership, resilience, and the ability to guide teams through change with clarity, empathy, and integrity.',
 best:['Use these cards when designing or rebuilding systems, inspiring teams, or navigating resistance.','They support strategic planning, fostering collaboration, protecting what matters, and celebrating achievements while ensuring lasting impact.']}
};
let current = null;
let currentIndex = null;

const $ = id => document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}

function closeModal(){
  $('modal').style.display='none';
  $('modalin').innerHTML='';
  currentIndex=null;
}

function setScreen(name){
  ['home','deck','ints'].forEach(id => $(id).style.display = id===name ? 'block' : 'none');
  window.scrollTo(0,0);
}

function renderHome(){
  closeModal();
  current=null;
  setScreen('home');
}

function renderExpression(key){
  // A complete state replacement: no appending, no hidden old deck.
  closeModal();
  current=key;
  setScreen('deck');

  const [lab,title]=key.split('|');
  $('lab').textContent=lab;
  $('title').textContent=title;

  const container=$('cards');
  container.replaceChildren();

  const orientation=document.createElement('button');
  orientation.type='button';
  orientation.className='tile orientation';
  orientation.dataset.action='orientation';
  orientation.innerHTML='<span class="num">SET ORIENTATION</span><h3>Focus &amp; Best Use</h3><em>Understand when this expression may be most useful.</em>';
  container.appendChild(orientation);

  D[key].forEach((card,index)=>{
    const tile=document.createElement('button');
    tile.type='button';
    tile.className='tile';
    tile.dataset.action='card';
    tile.dataset.index=index;
    tile.innerHTML='<span class="num">'+String(index+1).padStart(2,'0')+'</span><h3>'+esc(card[0])+'</h3><em>'+esc(card[1])+'</em>';
    container.appendChild(tile);
  });
}

function renderIntegration(){
  closeModal();
  current=null;
  setScreen('ints');
  $('intgrid').replaceChildren();
  Object.entries(I).forEach(([title,v])=>{
    const el=document.createElement('div');
    el.className='int';
    el.innerHTML='<div class="k">INTEGRATION</div><h3>'+esc(title)+'</h3><p>'+esc(v[0])+'</p><p class="q">'+esc(v[1])+'</p>'+v[2].map(s=>'<div class="step"><b>'+esc(s[0])+'</b><p>'+esc(s[1])+'</p></div>').join('');
    $('intgrid').appendChild(el);
  });
}

function openOrientation(){
  if(!current) return;
  const f=F[current];
  const [lab,title]=current.split('|');
  $('modalin').innerHTML='<div class="card"><span class="k">'+esc(lab)+' · '+esc(title)+'</span><h2>Focus &amp; Best Use</h2><h3>Focus</h3><p class="ess" style="font-style:normal">'+esc(f.focus)+'</p><h3>Best Use</h3><ul>'+f.best.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="modalbar"><button class="btn pale" data-action="close-modal" type="button">Close</button><button class="btn gold" data-action="close-modal" type="button">Explore the Seven Cards →</button></div></div>';
  $('modal').style.display='flex';
}

function openCard(index){
  if(!current || !D[current][index]) return;
  currentIndex=index;
  const c=D[current][index];
  const [lab,title]=current.split('|');
  $('modalin').innerHTML='<div class="card"><span class="k">'+esc(lab)+' · '+esc(title)+'</span><h2>'+esc(c[0])+'</h2><p class="ess">'+esc(c[1])+'</p><div class="ref"><b>REFLECTION</b><p>'+esc(c[2])+'</p></div><div class="modalbar"><button class="btn pale" data-action="close-modal" type="button">Close</button><button class="btn gold" data-action="practice" type="button">Turn the Card →</button></div></div>';
  $('modal').style.display='flex';
}

function openPractice(){
  if(!current || currentIndex===null) return;
  const c=D[current][currentIndex];
  const [lab,title]=current.split('|');
  const labels=['Notice','Consider','Practise','For the Whole'];
  $('modalin').innerHTML='<div class="card back"><span class="k">'+esc(lab)+' · '+esc(title)+'</span><h2>From Reflection to Practice</h2>'+c[3].map((x,j)=>'<div class="step"><b>'+labels[j].toUpperCase()+'</b><p>'+esc(x)+'</p></div>').join('')+'<div class="modalbar"><button class="btn pale" data-action="reflection" type="button">← Reflection</button><button class="btn gold" data-action="draw-another" type="button">Draw Another</button></div></div>';
}

function drawFromCurrent(){
  if(!current) return;
  const n=D[current].length;
  let next=Math.floor(Math.random()*n);
  if(n>1 && next===currentIndex) next=(next+1)%n;
  openCard(next);
}

function drawGlobal(){
  const keys=Object.keys(D);
  const key=keys[Math.floor(Math.random()*keys.length)];
  current=key;
  setScreen('deck');
  const [lab,title]=key.split('|');
  $('lab').textContent=lab;
  $('title').textContent=title;
  const container=$('cards');
  container.replaceChildren();
  // Render the selected expression cleanly before opening the drawn card.
  D[key].forEach((card,index)=>{
    const tile=document.createElement('button');
    tile.type='button'; tile.className='tile'; tile.dataset.action='card'; tile.dataset.index=index;
    tile.innerHTML='<span class="num">'+String(index+1).padStart(2,'0')+'</span><h3>'+esc(card[0])+'</h3><em>'+esc(card[1])+'</em>';
    container.appendChild(tile);
  });
  openCard(Math.floor(Math.random()*D[key].length));
}

function renderSets(){
  const container=$('sets');
  container.replaceChildren();
  Object.keys(D).forEach(key=>{
    const [lab,title]=key.split('|');
    const button=document.createElement('button');
    button.type='button'; button.className='set'; button.dataset.action='expression'; button.dataset.key=key;
    button.innerHTML='<b>'+esc(lab)+'</b><h3>'+esc(title)+'</h3><p>Explore seven reflections for this leadership expression.</p>';
    container.appendChild(button);
  });
}

// One event listener for the entire application. This prevents stale handlers and state leakage.
document.addEventListener('click', e=>{
  const target=e.target.closest('[data-action]');
  if(target){
    const action=target.dataset.action;
    if(action==='expression') renderExpression(target.dataset.key);
    else if(action==='orientation') openOrientation();
    else if(action==='card') openCard(Number(target.dataset.index));
    else if(action==='practice') openPractice();
    else if(action==='reflection') openCard(currentIndex);
    else if(action==='draw-another') drawFromCurrent();
    else if(action==='close-modal') closeModal();
    return;
  }
  if(e.target===$('modal')) closeModal();
});

$('drawBtn').addEventListener('click',drawGlobal);
$('drawCurrentBtn').addEventListener('click',drawFromCurrent);
$('integrationBtn').addEventListener('click',renderIntegration);
$('backBtn').addEventListener('click',renderHome);
$('integrationBackBtn').addEventListener('click',renderHome);

renderSets();
renderHome();

</script>

</body></html>
